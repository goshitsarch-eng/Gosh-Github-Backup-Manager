name: Build Linux Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkg-config perl \
            openssl-devel curl wget file

      - name: Build release binary
        run: cargo build --release

      - name: Prepare Flatpak sources
        run: |
          mkdir -p packaging/flatpak/bin
          cp target/release/gosh-github-backup-manager packaging/flatpak/bin/

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.goshitsarcheng.gosh-github-backup-manager.yaml
          bundle: gosh-github-backup-manager.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          flatpak-builder-args: --no-debuginfo

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: gosh-github-backup-manager.flatpak
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gosh-github-backup-manager.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

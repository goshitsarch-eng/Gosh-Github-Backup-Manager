name: Build Linux Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkg-config perl \
            webkit2gtk4.1-devel gtk3-devel openssl-devel \
            libappindicator-gtk3-devel librsvg2-devel curl wget file \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (DEB for Flatpak input)
        run: npm run build -- --bundles deb

      - name: Copy DEB to Flatpak manifest location
        run: |
          cp src-tauri/target/release/bundle/deb/*.deb packaging/gosh-github-backup-manager.deb

      - name: Free up disk space
        run: |
          rm -rf src-tauri/target
          rm -rf node_modules
          rm -rf ~/.cargo/registry
          rm -rf ~/.rustup
          rm -rf .flatpak-builder/cache
          dnf clean all

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.goshitsarcheng.gosh-github-backup-manager.yaml
          bundle: gosh-github-backup-manager.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          flatpak-builder-args: --no-debuginfo

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: gosh-github-backup-manager.flatpak
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gosh-github-backup-manager.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

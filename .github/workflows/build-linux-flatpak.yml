name: Build Linux Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional)'
        required: false
        default: ''

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          dnf install -y webkit2gtk4.1-devel gtk3-devel openssl-devel \
            libappindicator-gtk3-devel librsvg2-devel curl wget file \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (DEB for Flatpak input)
        run: npm run build -- --bundles deb

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.goshitsarcheng.gosh-github-backup-manager.yaml
          bundle: gosh-github-backup-manager.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: gosh-github-backup-manager.flatpak
          if-no-files-found: error

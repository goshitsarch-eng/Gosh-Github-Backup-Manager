[package]
name = "gosh-github-backup-manager"
version = "2.1.0"
description = "A cross-platform app to backup your GitHub repositories"
authors = ["Gosh-Its-Arch"]
license = "AGPL-3.0"
edition = "2021"

[[bin]]
name = "gosh-github-backup-manager"
path = "src/main.rs"

[dependencies]
# GUI
iced = { version = "0.13", features = ["tokio", "svg"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Git
git2 = { version = "0.19", features = ["vendored-openssl"] }

# Archive
zip = "2"
walkdir = "2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
open = "5"
rfd = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
